# Render Blueprint: New > Blueprint > selecione o repositório.
# Variáveis marcadas com sync:false são pedidas no painel durante a criação.
services:
  - type: web
    name: atlas-erp-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: virginia # use a região do Supabase mais próxima (us-east-1 = N. Virginia)
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL # jdbc:postgresql://<host-do-session-pooler>:5432/postgres?sslmode=require
        sync: false
      - key: DATABASE_USERNAME # postgres.<project-ref>
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION_MINUTES
        value: "15"
      - key: JWT_REFRESH_EXPIRATION_DAYS
        value: "7"
      - key: CORS_ALLOWED_ORIGINS # https://seu-app.vercel.app,http://localhost:5173
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: FLYWAY_LOCATIONS
        value: classpath:db/migration
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
