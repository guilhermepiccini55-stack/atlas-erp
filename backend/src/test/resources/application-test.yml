# O datasource é fornecido em tempo de execução pelo Testcontainers (PostgresTestContainer).
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

app:
  jwt:
    secret: segredo-somente-para-testes-com-mais-de-32-caracteres-0123456789
    access-expiration-minutes: 15
    refresh-expiration-days: 7
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
    com.atlas.erp: INFO
